name: Build A21s FM Radio APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK (Exynos 850)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Debug & Release Unsigned APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK (Siap Install)
        uses: actions/upload-artifact@v4
        with:
          name: A21s-FM-Radio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: A21s-FM-Radio-Release-Unsigned-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30
